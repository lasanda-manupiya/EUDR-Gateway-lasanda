# Local development stack. For production, set DJANGO_DEBUG=0, a real secret key,
# HTTPS termination, SMTP, Redis, and a static file server (e.g. whitenoise or nginx).
services:
  db:
    image: postgis/postgis:16-3.4
    environment: { POSTGRES_DB: eudr, POSTGRES_USER: eudr, POSTGRES_PASSWORD: eudr }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U eudr"], interval: 5s, retries: 10 }
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: db
      POSTGRES_PASSWORD: eudr
      PRIVATE_MEDIA_ROOT: /data/private_media
    volumes: [".:/app", "evidence:/data/private_media"]
    ports: ["${APP_PORT:-8000}:8000"]
    depends_on: { db: { condition: service_healthy } }
volumes: { pgdata: {}, evidence: {} }
