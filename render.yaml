# Render Blueprint: free web service (Docker) + free PostgreSQL (PostGIS enabled automatically by Django).
# Free tier: the web service sleeps after ~15 min idle; the free database expires after 30 days;
# uploaded evidence files are lost when the service restarts (no persistent disk on free).
services:
  - type: web
    name: sustainzone-eudr-gateway
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sustainzone-eudr-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SZ_ADMIN_EMAIL
        sync: false
      - key: SZ_ADMIN_NAME
        sync: false
      - key: SZ_ADMIN_PASSWORD
        sync: false
databases:
  - name: sustainzone-eudr-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
